{% extends "core/base.html" %}
{% block content %}
<div class="container mx-auto py-10">
    <h2 class="text-3xl font-bold mb-6">Add Day to {{ itinerary.title }}</h2>
    <form method="POST" class="bg-white p-6 rounded-lg shadow-md max-w-md mx-auto">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn bg-pink-500 hover:bg-pink-600 text-white px-6 py-2 rounded-md mt-4 w-full">
            Add Day
        </button>
    </form>
</div>
{% endblock %}
