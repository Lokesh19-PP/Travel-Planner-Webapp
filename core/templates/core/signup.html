{% extends "core/base.html" %}
{% block title %}Signup | Travel Planner{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gray-100 pt-24">
    <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md">
        <h2 class="text-3xl font-bold text-center text-indigo-600 mb-6">
            Create Account
        </h2>

        {% for message in messages %}
            <p class="text-red-500 text-sm mb-3 text-center">{{ message }}</p>
        {% endfor %}

        <form method="POST" class="space-y-4">
            {% csrf_token %}

            <input type="text" name="username" placeholder="Username"
                class="w-full px-4 py-2 border rounded" required>

            <input type="email" name="email" placeholder="Email"
                class="w-full px-4 py-2 border rounded" required>

            <input type="password" name="password1" placeholder="Password"
                class="w-full px-4 py-2 border rounded" required>

            <input type="password" name="password2" placeholder="Confirm Password"
                class="w-full px-4 py-2 border rounded" required>

            <button type="submit" class="btn w-full mt-4">
                Sign Up
            </button>
        </form>

        <p class="text-sm text-center mt-4">
            Already have an account?
            <a href="{% url 'login' %}" class="text-indigo-600 font-semibold">
                Login
            </a>
        </p>
    </div>
</div>
{% endblock %}
