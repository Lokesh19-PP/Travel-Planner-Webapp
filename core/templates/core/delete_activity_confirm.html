{% extends "core/base.html" %}
{% block content %}

<div class="max-w-md mx-auto p-6 bg-white rounded-xl shadow-md space-y-4 my-10 text-center">
    <h2 class="text-2xl font-bold text-red-600">Delete Activity</h2>
    <p class="text-gray-700">Are you sure you want to delete the activity: <strong>{{ activity.title }}</strong>?</p>

    <form method="POST">
        {% csrf_token %}
        <div class="flex gap-4 mt-6">
            <a href="{% url 'itinerary_detail' activity.day.itinerary.id %}" class="btn bg-gray-400 hover:bg-gray-500 text-white py-2 px-4 rounded-xl w-full">Cancel</a>
            <button type="submit"
                class="btn bg-red-600 hover:bg-red-700 text-white py-2 px-4 rounded-xl w-full">
                Yes, Delete
            </button>
        </div>
    </form>
</div>

{% endblock %}
