{% extends "core/base.html" %}
{% block title %}Signup | Travel Planner{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-purple-50 via-white to-indigo-50 px-4 sm:px-6 py-12 sm:py-24">

    <div class="bg-white rounded-3xl shadow-2xl p-6 sm:p-10 w-full max-w-md">
        <!-- Header -->
        <div class="text-center mb-6 sm:mb-8">
            <div class="text-5xl sm:text-6xl mb-3 sm:mb-4">🛫</div>
            <h2 class="text-2xl sm:text-3xl font-extrabold text-gray-800">Create Your Account</h2>
            <p class="text-gray-500 mt-1 text-sm sm:text-base">Join Travel Planner and start your journey!</p>
        </div>

        <!-- Signup Form -->
        <form method="POST" class="space-y-3 sm:space-y-4">
            {% csrf_token %}

            <input type="text" name="username" placeholder="Username"
                class="w-full px-4 py-3 sm:py-4 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 transition text-sm sm:text-base" required>

            <input type="email" name="email" placeholder="Email"
                class="w-full px-4 py-3 sm:py-4 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 transition text-sm sm:text-base" required>

            <input type="password" name="password1" placeholder="Password"
                class="w-full px-4 py-3 sm:py-4 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 transition text-sm sm:text-base" required>

            <input type="password" name="password2" placeholder="Confirm Password"
                class="w-full px-4 py-3 sm:py-4 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 transition text-sm sm:text-base" required>

            <button type="submit" 
                    class="btn w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3 sm:py-4 rounded-xl mt-2 shadow-md transition-transform transform hover:-translate-y-1 text-sm sm:text-base">
                Sign Up
            </button>
        </form>

        <!-- Login Link -->
        <p class="text-center mt-4 sm:mt-6 text-xs sm:text-sm text-gray-600">
            Already have an account?
            <a href="{% url 'login' %}" class="text-indigo-600 font-semibold hover:underline">Login</a>
        </p>
    </div>

</div>
{% endblock %}
