{% extends 'core/base.html' %}
{% block content %}
<section class="max-w-xl mx-auto py-20 px-6">
    <h2 class="text-2xl font-bold mb-6 text-center">
        Review {{ destination.name }}
    </h2>

    <form method="POST" class="bg-white p-6 rounded-xl shadow">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn w-full mt-4">Submit Review</button>
    </form>
</section>
{% endblock %}
