{% extends "core/base.html" %}
{% block title %}Signup | Travel Planner{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-indigo-50 via-white to-pink-50 px-4 sm:px-6 py-12 sm:py-24 relative overflow-hidden">
    
    <!-- Decorative Blobs -->
    <div class="absolute top-0 right-0 w-72 h-72 bg-pink-300 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-pulse"></div>
    <div class="absolute bottom-0 left-0 w-72 h-72 bg-indigo-300 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-pulse"></div>

    <div class="glass-card border border-white/60 rounded-[2rem] shadow-2xl p-8 sm:p-12 w-full max-w-md relative z-10 scroll-reveal">
        <!-- Header -->
        <div class="text-center mb-8">
            <div class="text-6xl mb-4 drop-shadow-md">🛫</div>
            <h2 class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-teal-500 to-indigo-600 tracking-tight">Create Account</h2>
            <p class="text-gray-500 mt-2 font-medium">Join Travel Planner and start your journey!</p>
        </div>

        <!-- Signup Form -->
        <form method="POST" class="space-y-4">
            {% csrf_token %}

            <input type="text" name="username" placeholder="Username"
                class="w-full px-5 py-4 border-0 bg-white/60 shadow-inner rounded-xl focus:outline-none focus:ring-4 focus:ring-indigo-400 font-medium transition text-gray-700" required>

            <input type="email" name="email" placeholder="Email"
                class="w-full px-5 py-4 border-0 bg-white/60 shadow-inner rounded-xl focus:outline-none focus:ring-4 focus:ring-indigo-400 font-medium transition text-gray-700" required>

            <input type="password" name="password1" placeholder="Password"
                class="w-full px-5 py-4 border-0 bg-white/60 shadow-inner rounded-xl focus:outline-none focus:ring-4 focus:ring-indigo-400 font-medium transition text-gray-700" required>

            <input type="password" name="password2" placeholder="Confirm Password"
                class="w-full px-5 py-4 border-0 bg-white/60 shadow-inner rounded-xl focus:outline-none focus:ring-4 focus:ring-indigo-400 font-medium transition text-gray-700" required>

            <button type="submit" 
                    class="btn-glow w-full bg-gradient-to-r from-indigo-500 to-purple-600 text-white font-bold py-4 rounded-xl mt-4 shadow-xl transition transform hover:scale-[1.02]">
                Sign Up
            </button>
        </form>

        <!-- Login Link -->
        <p class="text-center mt-8 text-sm font-medium text-gray-600">
            Already have an account?
            <a href="{% url 'login' %}" class="text-indigo-600 font-extrabold hover:underline">Login</a>
        </p>
    </div>

</div>
{% endblock %}
