{% extends "core/base.html" %}
{% block content %}
<section class="bg-gray-50 py-24">
  <div class="max-w-7xl mx-auto px-6">
    <h2 class="text-3xl font-bold text-center mb-12">Create Itinerary</h2>

    <form method="POST" action="">
        {% csrf_token %}
        
        <div class="mb-4">
            {{ form.name.label_tag }}
            {{ form.name }}
        </div>

        <div class="mb-4">
            {{ form.start_date.label_tag }}
            {{ form.start_date }}
        </div>

        <div class="mb-4">
            {{ form.end_date.label_tag }}
            {{ form.end_date }}
        </div>

        <div class="mb-4">
            <p class="font-bold mb-2">Select Destinations:</p>
            {{ form.destinations }}
        </div>

        <button type="submit" class="btn w-full">Create Itinerary</button>
    </form>
  </div>
</section>

{% endblock %}
