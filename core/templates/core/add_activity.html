{% extends "core/base.html" %}
{% block content %}

<div class="max-w-md mx-auto p-6 bg-white rounded-xl shadow-md space-y-4">
    <h2 class="text-2xl font-bold text-center">Add Activity - Day {{ day.day_number }}</h2>

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit"
            class="btn bg-pink-500 hover:bg-pink-600 text-white py-2 px-4 rounded-full w-full text-center">
            Add Activity
        </button>
    </form>
</div>

{% endblock %}
