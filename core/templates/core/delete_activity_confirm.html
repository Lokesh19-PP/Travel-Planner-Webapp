{% extends "core/base.html" %}
{% block title %}Delete Activity | Travel Planner{% endblock %}

{% block content %}
<section class="min-h-[60vh] flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-lg glass-card p-10 md:p-12 rounded-[3rem] shadow-2xl relative overflow-hidden scroll-reveal border-white/40 text-center">
        
        <div class="w-20 h-20 bg-red-50 text-red-500 rounded-3xl flex items-center justify-center text-3xl mx-auto mb-6 shadow-inner italic">🗑️</div>
        
        <h2 class="text-3xl font-black text-gray-900 tracking-tight mb-4">Remove Activity?</h2>
        <p class="text-gray-500 font-medium mb-10">Are you sure you want to delete <span class="text-indigo-600 font-black">"{{ activity.title }}"</span>? This action cannot be undone.</p>

        <form method="POST">
            {% csrf_token %}
            <div class="flex flex-col sm:flex-row gap-4">
                <a href="{% url 'itinerary_detail' activity.day.itinerary.id %}" class="flex-1 bg-gray-50 text-gray-400 py-4 rounded-2xl font-black text-center hover:bg-gray-100 transition active:scale-95 text-sm uppercase tracking-widest">No, Keep it</a>
                <button type="submit" class="flex-1 bg-red-500 text-white font-black py-4 rounded-2xl text-lg shadow-xl shadow-red-500/20 active:scale-[0.98] transition">
                    Yes, Delete
                </button>
            </div>
        </form>
    </div>
</section>
{% endblock %}
