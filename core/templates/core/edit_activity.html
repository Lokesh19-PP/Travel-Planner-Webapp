{% extends "core/base.html" %}
{% block content %}

<div class="max-w-md mx-auto p-6 bg-white rounded-xl shadow-md space-y-4 my-10">
    <h2 class="text-2xl font-bold text-center">Edit Activity</h2>

    <form method="POST">
        {% csrf_token %}
        <div class="space-y-4">
            {{ form.as_p }}
        </div>
        <div class="flex gap-4 mt-6">
            <a href="{% url 'itinerary_detail' activity.day.itinerary.id %}" class="btn bg-gray-400 hover:bg-gray-500 text-white py-2 px-4 rounded-xl w-full text-center">Cancel</a>
            <button type="submit"
                class="btn bg-indigo-600 hover:bg-indigo-700 text-white py-2 px-4 rounded-xl w-full text-center">
                Save Activity
            </button>
        </div>
    </form>
</div>

{% endblock %}
