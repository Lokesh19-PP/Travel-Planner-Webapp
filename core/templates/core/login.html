{% extends 'core/base.html' %}
{% block title %}Login{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-purple-50 via-white to-indigo-50 px-4 sm:px-6">

    <div class="bg-white rounded-3xl shadow-2xl p-6 sm:p-10 w-full max-w-md">
        <!-- Header -->
        <div class="text-center mb-6 sm:mb-8">
            <div class="text-5xl sm:text-6xl mb-3 sm:mb-4">🔑</div>
            <h2 class="text-2xl sm:text-3xl font-extrabold text-gray-800">Welcome Back</h2>
            <p class="text-gray-500 mt-1 text-sm sm:text-base">Login to continue your travel journey</p>
        </div>

        <!-- Messages -->
        {% if messages %}
            {% for message in messages %}
                <p class="text-red-500 text-xs sm:text-sm text-center mb-2">{{ message }}</p>
            {% endfor %}
        {% endif %}

        <!-- Form -->
        <form method="POST" class="space-y-3 sm:space-y-4">
            {% csrf_token %}
            <input type="text" name="username" placeholder="Username"
                class="w-full px-4 py-3 sm:py-4 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 transition text-sm sm:text-base">

            <input type="password" name="password" placeholder="Password"
                class="w-full px-4 py-3 sm:py-4 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 transition text-sm sm:text-base">

            <button class="btn w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3 sm:py-4 rounded-xl mt-2 transition-transform transform hover:-translate-y-1 shadow-md text-sm sm:text-base">
                Login
            </button>
        </form>

        <!-- Signup Link -->
        <p class="text-center mt-4 sm:mt-6 text-xs sm:text-sm text-gray-600">
            Don’t have an account?
            <a href="{% url 'signup' %}" class="text-indigo-600 font-semibold hover:underline">Sign up</a>
        </p>
    </div>

</div>
{% endblock %}
