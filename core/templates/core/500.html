{% extends "core/base.html" %}
{% block title %}Turbulence | Travel Planner{% endblock %}

{% block content %}
<section class="min-h-[80vh] flex flex-col items-center justify-center text-center px-6">
    <div class="glass-card p-12 md:p-24 rounded-[4rem] shadow-2xl relative overflow-hidden scroll-reveal max-w-2xl border-white/40">
        <!-- Background Blur Decor -->
        <div class="absolute -top-10 -left-10 w-40 h-40 bg-red-100 rounded-full blur-3xl opacity-50"></div>
        <div class="absolute -bottom-10 -right-10 w-40 h-40 bg-orange-100 rounded-full blur-3xl opacity-50"></div>

        <h1 class="text-[8rem] md:text-[12rem] font-black text-red-500 leading-none mb-4 tracking-tighter mix-blend-multiply opacity-20 relative z-10">500</h1>
        
        <div class="relative z-10 -mt-20 md:-mt-28">
            <div class="text-6xl mb-8">⛈️</div>
            <h2 class="text-4xl md:text-5xl font-black text-gray-900 mb-6 tracking-tight">Severe Turbulence!</h2>
            <p class="text-xl text-gray-500 mb-12 font-medium">Something went wrong in the cockpit. Our ground crew is already working on it.</p>
            
            <a href="{% url 'home' %}" class="btn-premium px-12 py-5 text-white font-black rounded-3xl shadow-xl shadow-indigo-500/20 active:scale-95 transition inline-block text-lg">
                Emergency Landing (Home)
            </a>
        </div>
    </div>
</section>
{% endblock %}
