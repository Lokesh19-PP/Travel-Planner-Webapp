{% extends "core/base.html" %}
{% block content %}

<div class="max-w-4xl mx-auto p-6 bg-white shadow rounded-lg">
    <h1 class="text-3xl font-bold mb-4">{{ destination.name }}</h1>
    <p class="text-gray-600 mb-2">{{ destination.country }}</p>
    <p class="text-sm text-gray-500 mb-2">Tag: {{ destination.tag }}</p>
    <p class="text-sm text-gray-500 mb-2">Price Level: {{ destination.price_level }}</p>
    <p class="mt-4">{{ destination.description }}</p>

    <a href="{% url 'destination_list' %}"
       class="inline-block mt-6 px-4 py-2 bg-gray-500 text-white rounded hover:bg-gray-600">
       Back to Destinations
    </a>
</div>

{% endblock %}
