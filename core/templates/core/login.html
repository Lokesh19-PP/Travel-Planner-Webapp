{% extends 'core/base.html' %}
{% block title %}Login{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gray-100">
    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
        <h2 class="text-3xl font-bold text-center mb-6">Login</h2>

        {% if messages %}
            {% for message in messages %}
                <p class="text-red-500 text-sm text-center">{{ message }}</p>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <input type="text" name="username" placeholder="Username"
                class="w-full mb-4 px-4 py-3 border rounded-md focus:outline-none">

            <input type="password" name="password" placeholder="Password"
                class="w-full mb-6 px-4 py-3 border rounded-md focus:outline-none">

            <button class="btn w-full">Login</button>
        </form>

        <p class="text-center mt-4 text-sm">
            Don’t have an account?
            <a href="{% url 'signup' %}" class="text-indigo-600 font-semibold">Sign up</a>
        </p>
    </div>
</div>
{% endblock %}
