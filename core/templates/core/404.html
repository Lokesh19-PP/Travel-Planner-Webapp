{% extends "core/base.html" %}

{% block title %}Page Not Found | Travel Planner{% endblock %}

    <!-- 404 Heading -->
    <h1 class="text-6xl sm:text-7xl font-extrabold text-indigo-600 mb-4">404</h1>

    <!-- Message -->
    <p class="text-lg sm:text-2xl text-gray-700 mb-6 text-center">
        Oops! The page you are looking for does not exist.
    </p>

    <!-- Home Button -->
    <a href="{% url 'home' %}" 
       class="btn bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-3 rounded-xl text-sm sm:text-base transition-transform transform hover:-translate-y-1 shadow-md">
        Go to Home
    </a>

</div>
{% endblock %}
