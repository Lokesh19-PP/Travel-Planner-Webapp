{% extends "core/base.html" %}

{% block content %}

<!-- Filter Section -->
<div class="max-w-7xl mx-auto px-6 mb-8 flex flex-wrap gap-4 items-center">
    <form method="GET" class="flex flex-wrap gap-2 items-center">
        <select name="country" class="px-3 py-2 rounded border">
            <option value="">All Countries</option>
            {% for c in countries %}
                <option value="{{ c }}" {% if c == selected_country %}selected{% endif %}>{{ c }}</option>
            {% endfor %}
        </select>

        <select name="price_range" class="px-3 py-2 rounded border">
            <option value="">All Price Ranges</option>
            {% for p in price_ranges %}
                <option value="{{ p }}" {% if p == selected_price %}selected{% endif %}>{{ p }}</option>
            {% endfor %}
        </select>

        <button type="submit" class="btn">Filter</button>
        <a href="{% url 'destination_list' %}" class="btn bg-gray-300 text-black">Clear</a>
    </form>
</div>


<section class="bg-gray-100 py-24">
    <div class="max-w-7xl mx-auto px-6">
        <h2 class="section-title">Popular Destinations</h2>
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-8 mt-12">
            {% for destination in destinations %}
            <div class="card hover:shadow-xl transition transform hover:-translate-y-1">
                <img src="{{ destination.image.url }}" alt="{{ destination.name }}" class="w-full h-48 object-cover rounded-t-md">
                <div class="p-4">
                    <h3 class="text-xl font-bold mb-2">{{ destination.name }}</h3>
                    <p class="text-gray-600 mb-2">{{ destination.country }} | Price Level: {{ destination.price_level }}</p>
                    <p class="text-sm text-gray-500 mb-4">{{ destination.tag }}</p>
                    <a href="{% url 'destination_detail' destination.slug %}" class="btn w-full">View Details</a>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</section>
{% endblock %}
