{% extends "core/base.html" %}
{% block content %}
<section class="bg-gray-50 py-24">
    <div class="max-w-4xl mx-auto px-6">
        <div class="card p-6 bg-white shadow-lg rounded-lg">
            <h1 class="text-3xl font-bold mb-4">{{ itinerary.name }}</h1>
            <p class="text-gray-600 mb-2">Start: {{ itinerary.start_date }} | End: {{ itinerary.end_date }}</p>
            <h3 class="text-xl font-bold mb-2">Destinations:</h3>
            <ul class="list-disc list-inside mb-4">
                {% for dest in itinerary.destinations.all %}
                <li>{{ dest.name }} ({{ dest.country }})</li>
                {% endfor %}
            </ul>
            <a href="{% url 'itinerary_list' %}" class="btn w-full">Back to Itineraries</a>
        </div>
    </div>
</section>
{% endblock %}
