{% extends 'core/base.html' %}
{% block title %}Join Us | Travel Planner{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center px-4 relative">
    <div class="glass-card rounded-[3rem] shadow-2xl p-10 md:p-16 w-full max-w-lg relative z-10 scroll-reveal border-white/40">
        
        <!-- Header -->
        <div class="text-center mb-10">
            <div class="w-20 h-20 bg-pink-50 text-pink-500 rounded-3xl flex items-center justify-center text-4xl mx-auto mb-6 shadow-inner tracking-tighter">🛫</div>
            <h2 class="text-4xl font-black text-gray-900 tracking-tight">Join the Journey</h2>
            <p class="text-gray-500 mt-3 font-bold uppercase tracking-widest text-xs">Create your explorer account</p>
        </div>

        <!-- Form -->
        <form method="POST" class="space-y-5">
            {% csrf_token %}
            
            <div class="space-y-1">
                <label class="text-xs font-black text-gray-400 uppercase tracking-widest pl-4">Username</label>
                <input type="text" name="username" placeholder="Username"
                    class="w-full px-6 py-4 bg-white/50 border-0 rounded-2xl focus:ring-4 focus:ring-indigo-500/10 font-bold transition text-gray-800 placeholder:text-gray-300 outline-none shadow-inner" required>
            </div>

            <div class="space-y-1">
                <label class="text-xs font-black text-gray-400 uppercase tracking-widest pl-4">Email Address</label>
                <input type="email" name="email" placeholder="explorer@travel.com"
                    class="w-full px-6 py-4 bg-white/50 border-0 rounded-2xl focus:ring-4 focus:ring-indigo-500/10 font-bold transition text-gray-800 placeholder:text-gray-300 outline-none shadow-inner" required>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="space-y-1">
                    <label class="text-xs font-black text-gray-400 uppercase tracking-widest pl-4">Password</label>
                    <input type="password" name="password1" placeholder="••••••••"
                        class="w-full px-6 py-4 bg-white/50 border-0 rounded-2xl focus:ring-4 focus:ring-indigo-500/10 font-bold transition text-gray-800 placeholder:text-gray-300 outline-none shadow-inner" required>
                </div>
                <div class="space-y-1">
                    <label class="text-xs font-black text-gray-400 uppercase tracking-widest pl-4">Confirm</label>
                    <input type="password" name="password2" placeholder="••••••••"
                        class="w-full px-6 py-4 bg-white/50 border-0 rounded-2xl focus:ring-4 focus:ring-indigo-500/10 font-bold transition text-gray-800 placeholder:text-gray-300 outline-none shadow-inner" required>
                </div>
            </div>

            <button type="submit" class="btn-premium w-full text-white font-black py-5 rounded-2xl mt-6 text-lg shadow-xl shadow-indigo-500/20 active:scale-[0.98] transition">
                Create Account
            </button>
        </form>

        <!-- Footer -->
        <div class="text-center mt-12 pt-8 border-t border-gray-100">
            <p class="text-gray-500 font-bold text-sm">
                Already an explorer? 
                <a href="{% url 'login' %}" class="text-indigo-600 hover:underline ml-1">Login here</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
